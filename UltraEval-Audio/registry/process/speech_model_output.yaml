extract_audio:
  class: audio_evals.process.base.JsonExtract
  args:
    extract_key: audio

extract_text:
  class: audio_evals.process.base.JsonExtract
  args:
    extract_key: text

extract_voicelive_combined:
  class: audio_evals.process.base.JsonExtract
  args:
    extract_key: null  # Returns the entire JSON object

extract_query:
  class: audio_evals.process.base.JsonExtract
  args:
    extract_key: query

extract_response:
  class: audio_evals.process.base.JsonExtract
  args:
    extract_key: response

speech2text:
  class: audio_evals.process.speech.Speech2text
  args:
    model_name: whisper

speech2text-zh:
  class: audio_evals.process.speech.Speech2text
  args:
    model_name: paraformer-zh
    prompt_name: simple-asr
