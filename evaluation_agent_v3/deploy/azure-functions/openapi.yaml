openapi: 3.0.0
info:
  title: VoiceLive Evaluation Tools API
  description: HTTP API for VoiceLive evaluation tools, called by Foundry Agent
  version: 1.0.0

servers:
  - url: https://{functionAppName}.azurewebsites.net/api
    variables:
      functionAppName:
        default: voicelive-eval-tools
        description: Azure Function App name

# Security scheme for Function Key authentication
components:
  securitySchemes:
    functionKey:
      type: apiKey
      name: x-functions-key
      in: header
      description: Azure Function key for authentication

# Apply security globally (can be overridden per-operation)
security:
  - functionKey: []

paths:
  /list_datasets:
    post:
      operationId: list_datasets
      summary: List available datasets
      description: Lists ALL available JSONL datasets for evaluation from blob storage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_path:
                  type: string
                  description: Optional prefix to filter datasets
      responses:
        '200':
          description: List of datasets
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  datasets_found:
                    type: integer
                  datasets:
                    type: array
                    items:
                      type: object

  /check_dataset_schema:
    post:
      operationId: check_dataset_schema
      summary: Check dataset schema
      description: Analyzes a JSONL dataset to check for required and optional fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataset_path
              properties:
                dataset_path:
                  type: string
                  description: Path to JSONL file in blob storage
      responses:
        '200':
          description: Schema analysis results
          content:
            application/json:
              schema:
                type: object

  /validate_dataset_consistency:
    post:
      operationId: validate_dataset_consistency
      summary: Validate dataset consistency
      description: Validates JSONL dataset for structural integrity and completeness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataset_path
              properties:
                dataset_path:
                  type: string
                  description: Path to JSONL file in blob storage
                expected_turns:
                  type: integer
                  description: Expected number of turns per conversation
                ignore_comments:
                  type: boolean
                  description: Skip comment lines
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                type: object

  /validate_dataset_quality:
    post:
      operationId: validate_dataset_quality
      summary: Validate dataset quality
      description: Assesses content quality of a validated dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataset_path
              properties:
                dataset_path:
                  type: string
                  description: Path to JSONL file in blob storage
                strict:
                  type: boolean
                  description: Use strict matching
                verbose:
                  type: boolean
                  description: Show detailed analysis
      responses:
        '200':
          description: Quality analysis results
          content:
            application/json:
              schema:
                type: object

  /get_evaluation_recommendations:
    post:
      operationId: get_evaluation_recommendations
      summary: Get evaluation recommendations
      description: Analyzes a dataset and provides recommended settings for evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataset_path
              properties:
                dataset_path:
                  type: string
                  description: Path to validated JSONL dataset
      responses:
        '200':
          description: Recommended settings
          content:
            application/json:
              schema:
                type: object

  /run_voicelive_evaluation:
    post:
      operationId: run_voicelive_evaluation
      summary: Run VoiceLive evaluation
      description: |
        Runs Azure VoiceLive audio evaluation tests followed by Foundry evaluators.
        This is an async operation - use check_evaluation_status to poll for completion.
        When complete, results include a Foundry portal URL for detailed analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - test_files_path
              properties:
                test_files_path:
                  type: string
                  description: Path to dataset in blob storage (e.g., "Eiffel_Tower_Visit_1" or "datasets/sample.jsonl")
                session_mode:
                  type: string
                  enum: [per-conversation, per-file, single]
                  description: How to group test files into VoiceLive sessions
                max_workers:
                  type: integer
                  description: Number of parallel workers (default 4)
                evaluators:
                  type: array
                  items:
                    type: string
                  description: |
                    List of evaluators to run. Options include:
                    - "intent_resolution" - Does response match user intent
                    - "task_adherence" - Did agent follow instructions
                    - "task_completion" - Was the task completed
                    - "response_completeness" - Is response complete vs ground truth
                    - "groundedness" - Is response grounded in context
                    - "relevance" - Is response relevant to query
                    - "tool_call_accuracy" - Were tool calls correct
                    - "tool_selection" - Were correct tools selected
                    - "fluency" - Language quality
                    - "coherence" - Logical flow
                    If not specified, defaults to all available evaluators.
                run_voicelive_tests:
                  type: boolean
                  description: Whether to run VoiceLive audio tests (default true). Set false to only run evaluators on existing data.
      responses:
        '200':
          description: Evaluation job started (returns instance_id for status checking)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: "started"
                  instance_id:
                    type: string
                    description: ID to use with check_evaluation_status

  /check_evaluation_status:
    post:
      operationId: check_evaluation_status
      summary: Check evaluation job status
      description: |
        Checks the status of a running evaluation job. Use the instance_id 
        returned from run_voicelive_evaluation to poll for completion.
        When completed, includes foundry_portal_url for detailed results viewing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - instance_id
              properties:
                instance_id:
                  type: string
                  description: The instance_id returned from run_voicelive_evaluation
      responses:
        '200':
          description: Evaluation status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, running, completed, failed]
                    description: When 'completed', use instance_id with analyze_evaluation_results
                  instance_id:
                    type: string
                    description: Use this with analyze_evaluation_results when status is completed
                  foundry_portal_url:
                    type: string
                    description: URL to view evaluation results in Azure AI Foundry portal. ALWAYS present this URL to the user when evaluation completes.
                  output:
                    type: object
                    description: Results when completed. Pass instance_id to analyze_evaluation_results for analysis.

  /analyze_evaluation_results:
    post:
      operationId: analyze_evaluation_results
      summary: Analyze evaluation results
      description: |
        Analyzes VoiceLive evaluation OUTPUT files to extract insights.
        IMPORTANT: This analyzes RESULTS from completed evaluations, NOT datasets.
        Use the instance_id from check_evaluation_status when status is 'completed'.
        Results are stored at: evaluations/{instance_id}/results.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - results_path
              properties:
                results_path:
                  type: string
                  description: |
                    Path to evaluation RESULTS (not datasets). Use the instance_id 
                    from a completed evaluation. Examples: 
                    - "647c23909ccf4d6fb66c151a29aa5ee3" (instance_id only)
                    - "evaluations/647c23909ccf4d6fb66c151a29aa5ee3/results.json"
                    DO NOT pass dataset paths like "datasets/..." here.
      responses:
        '200':
          description: Analysis results
          content:
            application/json:
              schema:
                type: object

security:
  - functionKey: []

components:
  securitySchemes:
    functionKey:
      type: apiKey
      in: query
      name: code
      description: Azure Function key for authentication
