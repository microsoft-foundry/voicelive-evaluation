# Azure Developer CLI (azd) configuration
# Deploy VoiceLive Evaluation Agent v2 to Azure Container Apps

name: voicelive-evaluation-agent
metadata:
  template: voicelive-evaluation-agent@0.2.0

# Infrastructure configuration
infra:
  provider: bicep
  path: infra
  module: main

# Service definitions
services:
  agent:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

# Hooks for custom deployment steps
hooks:
  postprovision:
    shell: pwsh
    run: |
      Write-Host "Infrastructure provisioned successfully"
      Write-Host "Storage Account: $env:AZURE_STORAGE_ACCOUNT"
      Write-Host "Foundry Endpoint: $env:AZURE_FOUNDRY_ENDPOINT"
  
  postdeploy:
    shell: pwsh
    run: |
      Write-Host "Agent deployed successfully"
      Write-Host "Container App URL: $env:AZURE_CONTAINER_APP_URL"
