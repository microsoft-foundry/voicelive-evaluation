name: voicelive-audio-evaluation
version: 1.0.0
language: python
description: |
  Runs Azure VoiceLive audio evaluation tests using test audio files and conversation datasets.
  Processes audio through VoiceLive API and captures evaluation metrics including transcription,
  response quality, latency, and conversation flow. Supports both single-file and batch processing
  modes with customizable system prompts and tool definitions.

when_to_use: |
  Use this skill when you need to:
  - Evaluate VoiceLive API performance with audio test files
  - Process conversation datasets with audio inputs through VoiceLive
  - Capture evaluation metrics (transcription accuracy, response quality, latency)
  - Test VoiceLive with custom system prompts and tool definitions
  - Run batch evaluations across multiple audio files or datasets
  - Generate evaluation reports with conversation transcripts and metadata
  
  This skill is specifically for RUNTIME evaluation of VoiceLive API, not dataset validation.
  For validating dataset structure/quality, use the dataset-validator skills instead.

entry_point: ../../../prototype_v1/voice_agent_audio_input_evaluation.py

parameters:
  - name: test_files_path
    type: string
    required: true
    description: |
      Path to audio test file (.wav) or dataset file (.jsonl).
      - For single audio: Provide path to .wav file
      - For datasets: Provide path to .jsonl file containing conversation definitions
      Dataset format: Each line must be valid JSON with fields:
        - audio_file: Path to audio file (relative to .jsonl location)
        - system_prompt: Custom system instruction for this conversation
        - tool_definitions: Array of tool definitions (optional)
        - expected_answer: Expected response for evaluation (optional)
    example: "C:\\datasets\\sample_conversation.jsonl"

  - name: output_dir
    type: string
    required: false
    description: |
      Directory for audio output files (recorded responses from VoiceLive).
      If not specified, outputs are saved in same directory as test_files_path.
      Creates timestamped subdirectories for each evaluation run.
    example: "C:\\output\\voicelive_audio"

  - name: evaluation_dir
    type: string
    required: false
    description: |
      Directory for evaluation result files (.jsonl format).
      Each evaluation produces a JSONL file with per-conversation metrics:
        - conversation_id: Unique identifier
        - audio_file: Input audio file used
        - system_prompt: System instruction used
        - user_message: Transcribed user input
        - assistant_response: VoiceLive response
        - latency_ms: Response latency
        - timestamp: Evaluation timestamp
      If not specified, no evaluation file is generated.
    example: "C:\\evaluations\\voicelive"

  - name: session_timestamp
    type: string
    required: false
    description: |
      Custom timestamp for this evaluation session (format: YYYYMMDD_HHMMSS).
      Used to organize outputs and evaluations. If not provided, auto-generated.
      Useful for tracking related evaluation runs.
    example: "20260131_015423"

  - name: evaluation_output_file_override
    type: string
    required: false
    description: |
      Override path for aggregate evaluation output file.
      When specified, all evaluations are written to this single file (batch mode).
      When not specified, creates separate evaluation files per dataset.
      Useful for consolidating results from multiple dataset runs.
    example: "C:\\evaluations\\aggregate_results.jsonl"

  - name: session_suffix
    type: string
    required: false
    description: |
      Suffix to append to session identifiers for tracking.
      Helps distinguish between multiple runs of the same dataset.
      Combined with session_timestamp for unique session identification.
    example: "wave1_iteration2"

returns:
  type: object
  description: |
    Evaluation results and output paths.
    Note: This script primarily writes results to files and prints to stdout.
    Return structure (when called programmatically):
      - success: boolean indicating completion
      - evaluation_file: path to evaluation JSONL file (if evaluation_dir specified)
      - output_directory: path to audio output directory
      - conversations_processed: number of conversations evaluated
      - session_timestamp: timestamp used for this run

environment_variables:
  - name: AZURE_VOICE_LIVE_ENDPOINT
    required: true
    description: "Azure VoiceLive service endpoint URL"
    example: "https://your-voicelive-endpoint.azure.com/"
  
  - name: AZURE_VOICE_LIVE_MODEL
    required: true
    description: "VoiceLive model deployment name"
    example: "gpt-4o-realtime-preview"
  
  - name: AZURE_VOICE_LIVE_API_VERSION
    required: false
    description: "API version for VoiceLive service"
    default: "2025-05-01-preview"
  
  - name: AZURE_VOICE_LIVE_API_KEY
    required: false
    description: |
      API key for authentication (OPTIONAL - Azure Identity is preferred).
      Script uses Azure DefaultAzureCredential by default (Managed Identity, Azure CLI, etc.).
      Only provide this if you cannot use Azure Identity authentication.

authentication:
  method: azure_identity
  description: |
    Uses Azure DefaultAzureCredential for authentication (Managed Identity, Azure CLI, etc.).
    Requires identity to have appropriate permissions on VoiceLive resource.
    Falls back to AZURE_VOICE_LIVE_API_KEY environment variable if Azure Identity fails.
    Scope: https://ai.azure.com/.default

examples:
  - description: "Evaluate single conversation from dataset"
    command: |
      python voice_agent_audio_input_evaluation.py 
        --test_files_path "C:\\datasets\\conversation_001.jsonl"
        --evaluation_dir "C:\\evaluations"
  
  - description: "Batch evaluation with aggregate output"
    command: |
      python voice_agent_audio_input_evaluation.py
        --test_files_path "C:\\datasets\\wave1_conversations.jsonl"
        --output_dir "C:\\output\\wave1"
        --evaluation_dir "C:\\evaluations"
        --evaluation_output_file_override "C:\\evaluations\\wave1_aggregate.jsonl"
        --session_suffix "wave1_run1"

  - description: "Natural language invocation (GitHub Copilot CLI)"
    natural_language:
      - "Run VoiceLive evaluation on dataset C:\\datasets\\test.jsonl"
      - "Evaluate VoiceLive performance with audio files in C:\\datasets\\wave2"
      - "Test VoiceLive with conversations from C:\\datasets\\sample.jsonl and save results to C:\\eval"

integration_modes:
  - name: "Command Line (Direct)"
    description: "Execute Python script directly with command-line arguments"
    use_when: "Running manual tests or from shell scripts"
  
  - name: "Python Module Import"
    description: "Import and call main() function programmatically"
    use_when: "Building custom evaluation workflows or automation pipelines"
  
  - name: "Agent Skill (Dynamic)"
    description: "Discovered and invoked by AI agents via skill definition"
    use_when: "Using with Foundry Agent Service, GitHub Copilot CLI, or other agent frameworks"

notes: |
  - Script requires Azure VoiceLive SDK: pip install azure-ai-voicelive
  - Audio files must be WAV format (16-bit PCM recommended)
  - Dataset JSONL files must have valid JSON per line (not JSON array)
  - Supports both legacy WebSocket and new SDK-based VoiceLive connections
  - Automatically handles UTF-8 encoding for international characters
  - Creates timestamped output directories to avoid overwriting results
  - Evaluation files use JSONL format (one JSON object per line) for easy processing
