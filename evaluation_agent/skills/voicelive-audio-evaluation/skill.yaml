name: voicelive-audio-evaluation
version: 1.1.0
language: python
description: |
  Runs Azure VoiceLive audio evaluation tests using test audio files and conversation datasets.
  Processes audio through VoiceLive API using the Azure VoiceLive SDK and captures evaluation 
  metrics including transcription, response quality, latency, tool usage, and VAD behavior.
  Supports single, per-file, and per-conversation session modes.

when_to_use: |
  Use this skill when you need to:
  - Evaluate VoiceLive API performance with audio test files
  - Process conversation datasets with audio inputs through VoiceLive
  - Capture evaluation metrics (transcription accuracy, response quality, latency, tool calls)
  - Test VoiceLive with custom system prompts and tool definitions
  - Run batch evaluations across multiple audio files or datasets
  - Generate evaluation reports compatible with Azure AI Evaluation SDK
  
  This skill is specifically for RUNTIME evaluation of VoiceLive API, not dataset validation.
  For validating dataset structure/quality, use the dataset-validator skills instead.

entry_point: ../../../prototype_v1/voice_agent_audio_input_evaluation.py

parameters:
  - name: test_files
    cli_flag: "--test-files"
    short_flag: "-f"
    type: string
    required: true
    description: |
      Path to audio test file (.wav) or dataset file (.jsonl).
      - For single audio: Provide path to .wav file
      - For datasets: Provide path to .jsonl file containing conversation definitions
      Dataset format: Each line must be valid JSON with fields:
        - WavPath: Path to audio file (relative to .jsonl location)
        - Question: User question text
        - Answer: Expected response for evaluation
        - conversationID: Groups multi-turn conversations
        - system_prompt: Custom system instruction for this conversation
        - tool_definitions: Array of tool definitions (optional)
    example: "./sample_evaluation_input/Eiffel_Tower_Visit/Eiffel_Tower_Visit.jsonl"

  - name: output_dir
    cli_flag: "--output-dir"
    short_flag: "-o"
    type: string
    required: false
    default: "./output"
    description: |
      Directory for audio output files (recorded responses from VoiceLive).
      Creates timestamped subdirectories for each evaluation run.
    example: "./output"

  - name: evaluation_dir
    cli_flag: "--evaluation"
    short_flag: "-e"
    type: string
    required: false
    default: "./output"
    description: |
      Directory for evaluation result files (.jsonl format).
      Each evaluation produces a JSONL file with per-turn metrics compatible
      with Azure AI Evaluation SDK evaluators.
    example: "./output"

  - name: session_mode
    cli_flag: "--session-mode"
    type: string
    required: false
    default: null
    choices: ["single", "per-file", "per-conversation"]
    description: |
      Session handling mode. AUTO-DETECTED if not specified:
      - per-conversation: Auto-selected when dataset has conversationID field
      - per-file: Auto-selected when dataset has NO conversationID field
      - single: ONLY use when explicitly requested - all files in one continuous session
      
      Let the system auto-detect unless user explicitly requests a specific mode.
    example: "per-conversation"

  - name: session_suffix
    cli_flag: "--session-suffix"
    type: string
    required: false
    description: |
      Suffix for identifying sessions in batch mode (e.g., conv-1, session-2).
      Helps distinguish between multiple runs of the same dataset.
    example: "wave1_run1"

  - name: aggregate_eval_file
    cli_flag: "--aggregate-eval-file"
    type: string
    required: false
    description: |
      Path to aggregated evaluation file for multi-session aggregation.
      Used by batch processor for consolidating results from multiple sessions.
    example: "./output/aggregate_results.jsonl"

  - name: verbose
    cli_flag: "--verbose"
    short_flag: "-v"
    type: boolean
    required: false
    default: false
    description: "Enable verbose/debug logging (DEBUG level instead of INFO)"

  - name: sample_rate
    cli_flag: "--sample-rate"
    type: integer
    required: false
    default: 16000
    description: "Audio sample rate in Hz for resampling"

returns:
  type: object
  description: |
    Evaluation results written to files and printed to stdout.
    Output includes:
      - Per-turn evaluation data in JSONL format
      - Operational metrics (latency, turn counts, audio response rates)
      - Tool call tracking and evaluation
      - Session summaries

environment_variables:
  - name: AZURE_VOICE_LIVE_ENDPOINT
    required: true
    description: "Azure VoiceLive service endpoint URL"
    example: "https://your-voicelive-endpoint.services.ai.azure.com/"
  
  - name: AZURE_VOICE_LIVE_MODEL
    required: true
    description: "VoiceLive model deployment name"
    example: "gpt-realtime"
  
  - name: AZURE_VOICE_LIVE_API_VERSION
    required: false
    description: "API version for VoiceLive service"
    default: "2025-10-01"

authentication:
  method: azure_identity
  description: |
    Uses Azure DefaultAzureCredential for authentication (Managed Identity, Azure CLI, etc.).
    Requires identity to have appropriate permissions on VoiceLive resource.
    Scope: https://cognitiveservices.azure.com/.default

examples:
  - description: "Evaluate dataset with default settings"
    command: |
      python voice_agent_audio_input_evaluation.py \
        --test-files "./sample_evaluation_input/Eiffel_Tower_Visit/Eiffel_Tower_Visit.jsonl"
  
  - description: "Per-conversation mode with custom output"
    command: |
      python voice_agent_audio_input_evaluation.py \
        --test-files "./datasets/multi_turn.jsonl" \
        --output-dir "./output/multi_turn" \
        --evaluation "./output/multi_turn" \
        --session-mode per-conversation
  
  - description: "Verbose batch evaluation"
    command: |
      python voice_agent_audio_input_evaluation.py \
        --test-files "./datasets/wave1.jsonl" \
        --session-mode per-conversation \
        --session-suffix "wave1_run1" \
        --verbose

integration_modes:
  - name: "Command Line (Direct)"
    description: "Execute Python script directly with command-line arguments"
    use_when: "Running manual tests or from shell scripts"
  
  - name: "Agent Skill (Dynamic)"
    description: "Discovered and invoked by AI agents via skill definition"
    use_when: "Using with Foundry Agent Service, GitHub Copilot CLI, or other agent frameworks"

notes: |
  - Requires Azure VoiceLive SDK: pip install azure-ai-voicelive>=1.1.0
  - Audio files must be WAV format (16-bit PCM recommended, will be resampled)
  - Dataset JSONL files must have valid JSON per line (not JSON array)
  - Uses official Azure VoiceLive SDK for improved stability and Windows compatibility
  - Generates evaluation data compatible with Azure AI Evaluation SDK evaluators
  - Supports tool calling with automatic tool execution tracking
