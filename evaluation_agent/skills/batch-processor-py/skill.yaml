name: batch-processor-py
description: |
  Batch processor for parallel VoiceLive audio evaluations. Wraps voice_agent_audio_input_evaluation.py 
  with multi-threaded execution using ThreadPoolExecutor. Use when evaluating large datasets that benefit 
  from parallel processing across multiple sessions.
  
  Key features:
  - Parallel session processing with configurable max-workers
  - Session isolation via subprocess (avoids global state conflicts)
  - Thread-safe file aggregation using filelock
  - Supports per-file, per-conversation, and single session modes
  
  Triggers: "batch evaluation", "parallel processing", "multi-threaded", "max-workers", 
  "faster evaluation", "batch_processor.py"

version: 1.0.0
author: VoiceLive Evaluation Team

# Script location relative to this skill's directory
script: ../../prototype_v1/batch_processor.py

# CLI interface
cli:
  usage: |
    python batch_processor.py --test-files <dataset.jsonl> [options]
    python batch_processor.py --test-files-folder <folder> [options]
  
  arguments:
    - name: --test-files
      type: string
      required: false  # Mutually exclusive with --test-files-folder
      description: Path to a single JSONL dataset file
    
    - name: --test-files-folder
      type: string
      required: false  # Mutually exclusive with --test-files
      description: Path to folder containing multiple JSONL dataset files
    
    - name: --session-mode
      type: string
      default: per-conversation
      choices: [single, per-file, per-conversation]
      description: |
        Session handling mode:
        - single: All files in one session (no parallelism)
        - per-file: Each file gets its own session (parallel)
        - per-conversation: Files grouped by conversationID (parallel)
    
    - name: --max-workers
      type: integer
      default: 1
      description: |
        Maximum number of parallel session processes.
        Recommended: 2-4 for local, 8-16 for cloud.
        Note: single mode always runs with 1 worker.
    
    - name: --output-dir
      type: string
      default: ./output
      description: Directory for audio output files and evaluation results
    
    - name: --evaluation
      type: string
      default: ./output
      description: Directory for JSONL evaluation data
    
    - name: --timeout
      type: integer
      default: 600
      description: Timeout in seconds for each session subprocess
    
    - name: --dry-run
      type: boolean
      default: false
      description: Preview sessions without running them
    
    - name: --verbose
      type: boolean
      default: false
      description: Show detailed subprocess output
    
    - name: --skip-evaluation
      type: boolean
      default: false
      description: Skip final evaluation step (only run audio processing)

# Example commands
examples:
  - description: Run parallel evaluation with 4 workers
    command: |
      python batch_processor.py \
        --test-files dataset.jsonl \
        --session-mode per-conversation \
        --max-workers 4
  
  - description: Process folder with per-file parallelism
    command: |
      python batch_processor.py \
        --test-files-folder ./datasets \
        --session-mode per-file \
        --max-workers 8
  
  - description: Dry run to preview sessions
    command: |
      python batch_processor.py \
        --test-files large_dataset.jsonl \
        --session-mode per-conversation \
        --max-workers 4 \
        --dry-run

# Integration notes
integration:
  agent_usage: |
    The evaluation agent automatically uses batch_processor.py when:
    - max_workers > 1 (parallel mode requested)
    - session_mode is per-file or per-conversation
    
    The agent falls back to voice_agent_audio_input_evaluation.py when:
    - max_workers = 1 or parallel = False
    - session_mode = single
  
  environment_variables:
    EVAL_AGENT_MAX_WORKERS: |
      Default worker count (default: 4).
      Set higher for cloud deployments (e.g., 16).
  
  output_format: |
    Results are aggregated into a single JSONL file using filelock
    for thread-safe concurrent writes. Final evaluation runs on
    the aggregated file.
