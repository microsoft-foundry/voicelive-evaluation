version: 2

# Config policy (aligned with voicelive-samples):
# - Ignore ALL major version bumps (handled as coordinated manual upgrades)
# - Group minor/patch updates per directory into a single PR
# - Limit open PRs to 5 per directory to reduce noise

updates:
  # Python - root
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "microsoft-foundry/voicelive-repo-maintainers"
    labels:
      - "dependencies"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python - evaluation_harness
  - package-ecosystem: "pip"
    directory: "/evaluation_harness"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "microsoft-foundry/voicelive-repo-maintainers"
    labels:
      - "dependencies"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python - evaluation_agent
  - package-ecosystem: "pip"
    directory: "/evaluation_agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "microsoft-foundry/voicelive-repo-maintainers"
    labels:
      - "dependencies"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python - evaluation_agent Azure Functions
  - package-ecosystem: "pip"
    directory: "/evaluation_agent/deploy/azure-functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "microsoft-foundry/voicelive-repo-maintainers"
    labels:
      - "dependencies"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python - evaluation_agent Container App
  - package-ecosystem: "pip"
    directory: "/evaluation_agent/deploy/container-app"
