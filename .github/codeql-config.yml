# CodeQL configuration for VoiceLive Evaluation
# Suppresses known false-positive path-injection alerts in storage modules
# where blob paths from API inputs are used with tempfile (safe pattern).

paths-ignore:
  - voicelive_quickstarts
  - TranscriptEvaluator

query-filters:
  - exclude:
      id: py/path-injection
      paths:
        - evaluation_agent/deploy/container-app/app/storage.py
