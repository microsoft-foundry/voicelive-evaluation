# VoiceLive Evaluation - Azure Developer CLI Configuration
# Solution Template for Azure AI Foundry Gallery
name: voicelive-evaluation

metadata:
  template: voicelive-evaluation@1.0

requiredVersions:
  azd: '>= 1.18.0'

# Infrastructure provisioning (references existing evaluation_agent infra)
infra:
  provider: bicep
  path: ./evaluation_agent/infra

# Services to deploy
services:
  # Azure Functions - evaluation tools API (23 endpoints)
  tools-api:
    project: ./evaluation_agent/deploy/azure-functions
    language: python
    host: function

  # VoiceLive Container App - audio processing (requires Docker Desktop)
  voicelive-processor:
    project: ./evaluation_agent/deploy/container-app
    language: python
    host: containerapp
    docker:
      remoteBuild: true

# Hooks for deployment lifecycle
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: scripts\preprovision.ps1
    posix:
      shell: sh
      run: scripts/preprovision.sh

  postprovision:
    windows:
      shell: pwsh
      run: .\evaluation_agent\scripts\azd\postprovision.ps1
    posix:
      shell: sh
      run: scripts/postprovision.sh

  postdeploy:
    windows:
      shell: pwsh
      run: .\evaluation_agent\scripts\azd\postdeploy.ps1
    posix:
      shell: sh
      run: scripts/postdeploy.sh
